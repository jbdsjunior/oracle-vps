# Recipe alternativa usando a sintaxe do BlueBuild (https://blue-build.org)
name: oracle-vps
description: Imagem de servidor imutável personalizada para Oracle Cloud A1.Flex ARM64
base-image: quay.io/fedora/fedora-bootc
image-version: 41

modules:
  - type: dnf
    install:
      - wireguard-tools
      - tailscale
      - podman
      - iptables
      - nftables
      - systemd-resolved
      - curl
      - wget
      - htop
      - nano

  - type: files
    files:
      - source: config/network/99-ip-forward.conf
        destination: /etc/sysctl.d/99-ip-forward.conf
      - source: config/containers/
        destination: /etc/containers/systemd/
      - source: config/systemd/bootc-update.service
        destination: /etc/systemd/system/bootc-update.service
      - source: config/systemd/bootc-update.timer
        destination: /etc/systemd/system/bootc-update.timer

  - type: systemd
    system:
      enabled:
        - tailscaled.service
        - podman.socket
        - podman-auto-update.timer
        - bootc-update.timer
